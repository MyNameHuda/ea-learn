<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="EaLearn">
  <!-- Simplified brand mark: the book character wearing a navy graduation cap,
       on the brand-blue tile. Proportions follow the raster artwork at
       public/logo-mark.png.

       This is the scalable approximation; the PNG/ICO icons carry the full
       detail. It has to stand on its own because browsers that support SVG
       icons prefer it over app/favicon.ico — an SVG left on the old design
       would have kept winning over the new raster one.

       At 16px the tile and the white face are all that survive; the cap, rays
       and tassel are tuned to stay readable rather than accurate. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f74e8"/>
      <stop offset="1" stop-color="#1157c8"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#tile)"/>

  <!-- graduation cap -->
  <path d="M18 30 L44 16 L70 30 L44 44 Z" fill="#0c3587"/>
  <path d="M26 38 L44 30 L62 38 L44 47 Z" fill="#123f96"/>

  <!-- book body (behind the face) -->
  <path d="M22 56 q22 -12 44 0 v26 q-22 -11 -44 0 Z" fill="#4a9bfb"/>

  <!-- face / open book pages -->
  <path d="M27 34 q17 -9 34 0 q5 3 5 10 v28 q-16 -8 -32 0 q-8 4 -8 -8 V44 q0 -7 1 -10 Z" fill="#ffffff"/>

  <!-- face marks -->
  <path d="M36 50 q4 -6 8 0" stroke="#0c3587" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M52 50 q4 -6 8 0" stroke="#0c3587" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M42 58 q6 6 12 0 q-6 3 -12 0 Z" fill="#0c3587"/>

  <!-- pages under the face -->
  <path d="M24 66 h44 v7 h-44 Z" fill="#ffffff"/>
  <path d="M26 76 h40 v6 h-40 Z" fill="#d8e8ff"/>

  <!-- tassel -->
  <circle cx="70" cy="36" r="3.4" fill="#f6c24a"/>
  <path d="M70 39 q4 8 1 13 q-5 1 -6 -3 q0 -6 5 -10 Z" fill="#f6c24a"/>

  <!-- little rays beside the tassel -->
  <g fill="#f6c24a">
    <rect x="78" y="42" width="9" height="3.4" rx="1.7" transform="rotate(-18 82.5 43.7)"/>
    <rect x="79" y="52" width="9" height="3.4" rx="1.7"/>
    <rect x="77" y="61" width="9" height="3.4" rx="1.7" transform="rotate(18 81.5 62.7)"/>
  </g>
</svg>